<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Das internationale Einheitensystem – Lernpfad</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css" onerror="this.onerror=null;this.href='https://unpkg.com/katex@0.16.22/dist/katex.min.css'">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"></script>

<style>
:root{
  --bg:#f4f7fb;
  --surface:rgba(255,255,255,.94);
  --surface-solid:#ffffff;
  --surface-2:#eef4ff;
  --text:#172033;
  --muted:#667387;
  --primary:#2d6cdf;
  --primary-dark:#184a9c;
  --primary-soft:#dbe8ff;
  --accent:#ffb703;
  --ok:#168a50;
  --ok-bg:#eaf8f1;
  --bad:#c63737;
  --bad-bg:#fff0f0;
  --line:#dce5f0;
  --line-strong:#c5d2e3;
  --shadow:0 12px 34px rgba(23,44,77,.10);
  --shadow-hover:0 16px 40px rgba(23,44,77,.15);
  --radius:22px;
  --radius-sm:15px;
  --chapter:#2d6cdf;
  --chapter-soft:#e9f1ff;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;padding:0;
  background:
    radial-gradient(circle at 12% 8%, rgba(74,137,240,.10), transparent 28%),
    radial-gradient(circle at 88% 16%, rgba(255,183,3,.08), transparent 24%),
    linear-gradient(180deg,#f8fbff 0%,#f4f7fb 42%,#f7f9fc 100%);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  min-height:100vh;
}
button,input,select{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{
  outline:4px solid rgba(45,108,223,.20);
  outline-offset:2px;
}
.app{min-height:100vh;display:flex;flex-direction:column}

.hero{
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 82% 24%, rgba(255,255,255,.18), transparent 18%),
    radial-gradient(circle at 72% 80%, rgba(255,183,3,.22), transparent 21%),
    linear-gradient(135deg,#123c84 0%,#1f5fc8 52%,#4b8aef 100%);
  color:#fff;padding:48px 22px 42px;
  border-bottom-left-radius:34px;
  border-bottom-right-radius:34px;
  box-shadow:0 18px 44px rgba(17,57,121,.20);
}
.hero::before,
.hero::after{
  content:"";
  position:absolute;
  border:1px solid rgba(255,255,255,.16);
  border-radius:50%;
  pointer-events:none;
}
.hero::before{width:240px;height:240px;right:-64px;top:-85px}
.hero::after{width:150px;height:150px;right:110px;bottom:-88px}
.hero-inner{max-width:980px;margin:auto;position:relative;z-index:1}
.hero h1{
  font-size:clamp(2.25rem,5.4vw,4rem);
  line-height:1.02;
  letter-spacing:-.035em;
  margin:14px 0 14px;
  max-width:850px;
}
.hero p{
  margin:0;max-width:760px;
  font-size:clamp(1rem,2.2vw,1.22rem);
  line-height:1.6;opacity:.96
}

.topbar{
  position:sticky;top:0;z-index:30;
  background:rgba(248,251,255,.84);
  backdrop-filter:blur(18px) saturate(1.25);
  border-bottom:1px solid rgba(203,217,235,.85);
  box-shadow:0 6px 20px rgba(34,58,91,.05);
}
.topbar-inner{
  max-width:1100px;margin:auto;padding:12px 16px;
  display:flex;gap:16px;align-items:center
}
.progress-wrap{flex:1;min-width:0}
.progress-label{
  font-size:.82rem;color:var(--muted);
  display:flex;justify-content:space-between;gap:14px;margin-bottom:7px
}
.progress{
  height:9px;
  background:#e4ebf5;
  border-radius:999px;
  overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(20,45,80,.06)
}
.progress > div{
  height:100%;width:0;
  background:linear-gradient(90deg,#2d6cdf,#76a7f3);
  box-shadow:0 0 12px rgba(45,108,223,.35);
  transition:width .32s ease
}
.chapter-select{
  min-width:245px;
  border:1px solid var(--line);
  border-radius:14px;
  padding:11px 38px 11px 13px;
  background:rgba(255,255,255,.96);
  color:var(--text);
  box-shadow:0 5px 16px rgba(26,51,84,.06);
}

main{
  width:min(100%,1100px);
  margin:0 auto;
  padding:26px 16px 112px;
}
.page{
  display:none;
  --chapter:#2d6cdf;
  --chapter-soft:#eaf2ff;
  animation:pageIn .28s cubic-bezier(.2,.8,.2,1)
}
.page[data-chapter="1"]{--chapter:#2d6cdf;--chapter-soft:#eaf2ff}
.page[data-chapter="2"]{--chapter:#4f67d8;--chapter-soft:#eef0ff}
.page[data-chapter="3"]{--chapter:#8a5fd0;--chapter-soft:#f3edff}
.page[data-chapter="4"]{--chapter:#0e8e83;--chapter-soft:#e7f7f5}
.page[data-chapter="5"]{--chapter:#0d7abf;--chapter-soft:#e8f4fb}
.page[data-chapter="6"]{--chapter:#d56a2f;--chapter-soft:#fff1e8}
.page[data-chapter="7"]{--chapter:#6c65cb;--chapter-soft:#f0efff}
.page[data-chapter="8"]{--chapter:#2d8a58;--chapter-soft:#eaf7ef}
.page[data-chapter="9"]{--chapter:#c25c84;--chapter-soft:#fcecf3}
.page.active{display:block}
@keyframes pageIn{
  from{opacity:.18;transform:translateY(10px) scale(.995)}
  to{opacity:1;transform:none}
}

.page-head{
  position:relative;
  display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
  margin:8px 0 20px;
  padding:21px 22px;
  background:linear-gradient(135deg,var(--chapter-soft),rgba(255,255,255,.94));
  border:1px solid color-mix(in srgb,var(--chapter) 15%, white);
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 10px 26px rgba(30,54,86,.06)
}
.page-head::after{
  content:"";
  position:absolute;
  right:-46px;top:-56px;
  width:150px;height:150px;border-radius:50%;
  background:color-mix(in srgb,var(--chapter) 10%, transparent);
}
.kicker{
  display:inline-flex;align-items:center;gap:7px;
  font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--chapter);font-weight:850;
  background:rgba(255,255,255,.75);
  border:1px solid color-mix(in srgb,var(--chapter) 18%, white);
  border-radius:999px;padding:6px 10px
}
.page h2{
  font-size:clamp(1.75rem,4vw,2.55rem);
  line-height:1.08;letter-spacing:-.025em;
  margin:.55rem 0 .38rem
}
.lead{
  color:var(--muted);
  font-size:1.04rem;
  line-height:1.6;
  max-width:820px;
  margin-bottom:0
}

.card{
  position:relative;
  background:var(--surface);
  border:1px solid rgba(215,225,238,.95);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:22px;
  margin:17px 0;
  overflow:hidden;
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease
}
.card:hover{
  transform:translateY(-1px);
  box-shadow:var(--shadow-hover);
  border-color:#cfdbea
}
.card h3{
  margin-top:0;
  margin-bottom:11px;
  font-size:1.18rem;
  letter-spacing:-.01em
}
.card p{line-height:1.65}
.note{
  position:relative;
  background:linear-gradient(135deg,var(--chapter-soft),rgba(255,255,255,.96));
  border:1px solid color-mix(in srgb,var(--chapter) 18%, white);
  border-left:5px solid var(--chapter);
  padding:16px 18px;
  border-radius:16px;
  line-height:1.58;
  box-shadow:0 7px 18px rgba(30,54,86,.04)
}
.eq{
  font-size:clamp(1.2rem,2.7vw,1.68rem);
  padding:12px 0;
  overflow-x:auto;overflow-y:hidden;
  color:#17233a
}
.katex-display{
  margin:.6em 0;
  overflow-x:auto;overflow-y:hidden;
  padding:2px 0
}
.katex{font-size:1.05em}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px
}
.stat{
  position:relative;
  padding:18px;
  border:1px solid var(--line);
  border-radius:18px;
  background:linear-gradient(160deg,#fff,#f9fbfe);
  box-shadow:0 6px 18px rgba(24,48,80,.05);
  overflow:hidden
}
.stat::before{
  content:"";
  position:absolute;left:0;top:0;bottom:0;width:4px;
  background:var(--chapter)
}
.stat strong{
  display:block;
  font-size:1.32rem;
  color:var(--chapter);
  margin-bottom:3px
}

.nav{
  position:fixed;left:0;right:0;bottom:0;
  background:rgba(249,251,254,.90);
  backdrop-filter:blur(18px) saturate(1.2);
  border-top:1px solid rgba(203,217,235,.9);
  z-index:40;
  box-shadow:0 -8px 28px rgba(25,50,84,.08)
}
.nav-inner{
  max-width:1100px;margin:auto;
  display:flex;gap:12px;
  padding:11px 16px calc(11px + env(safe-area-inset-bottom))
}
.btn{
  border:none;
  border-radius:14px;
  padding:12px 17px;
  min-height:50px;
  font-weight:780;
  transition:transform .16s ease,box-shadow .16s ease,background .16s ease;
  -webkit-tap-highlight-color:transparent
}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(0) scale(.99)}
.btn.primary{
  background:linear-gradient(135deg,#245fc5,#3c7ce4);
  color:#fff;
  box-shadow:0 8px 20px rgba(45,108,223,.24)
}
.btn.secondary{
  background:#edf3fb;
  color:#214f98;
  border:1px solid #d9e4f2
}
.btn.ghost{
  background:#fff;
  border:1px solid var(--line);
  color:var(--text)
}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.nav .btn{flex:1}

.feedback{
  margin-top:13px;
  padding:13px 15px;
  border-radius:14px;
  display:none;
  font-weight:650;
  line-height:1.45
}
.feedback.show{display:block;animation:feedbackIn .2s ease}
@keyframes feedbackIn{from{opacity:.2;transform:translateY(3px)}to{opacity:1;transform:none}}
.feedback.ok{
  background:var(--ok-bg);
  color:#11663b;
  border:1px solid #b9e3cb
}
.feedback.bad{
  background:var(--bad-bg);
  color:#9b2424;
  border:1px solid #efc2c2
}

.choice-list{
  display:grid;
  gap:11px;
  margin-top:13px;
  margin-bottom:12px
}
.choice{
  position:relative;
  display:flex;align-items:center;gap:11px;
  text-align:left;
  background:#fff;
  border:1px solid var(--line);
  padding:14px 15px;
  border-radius:15px;
  min-height:54px;
  box-shadow:0 4px 12px rgba(24,48,80,.04);
  transition:all .16s ease
}
.choice::before{
  content:"";
  width:18px;height:18px;border-radius:50%;
  border:2px solid #bcc9da;
  flex:0 0 auto;
  transition:all .16s ease
}
.choice:hover{
  border-color:#aebed3;
  transform:translateY(-1px)
}
.choice.selected{
  outline:none;
  border-color:var(--chapter);
  background:var(--chapter-soft)
}
.choice.selected::before{
  border-color:var(--chapter);
  box-shadow:inset 0 0 0 4px #fff;
  background:var(--chapter)
}
.choice.correct{background:#eaf8f1;border-color:#8dd0aa}
.choice.correct::before{border-color:var(--ok);background:var(--ok);box-shadow:inset 0 0 0 4px #fff}
.choice.wrong{background:#fff0f0;border-color:#e5a0a0}
.choice.wrong::before{border-color:var(--bad);background:var(--bad);box-shadow:inset 0 0 0 4px #fff}

.pairs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}
.pair{
  border:1px solid var(--line);
  background:linear-gradient(160deg,#fff,#fbfcfe);
  border-radius:16px;
  padding:15px;
  min-height:60px;
  text-align:left;
  box-shadow:0 5px 14px rgba(24,48,80,.04);
  transition:all .16s ease
}
.pair:hover{
  border-color:#b7c6d9;
  transform:translateY(-1px)
}
.pair.selected{
  outline:3px solid color-mix(in srgb,var(--chapter) 25%, transparent);
  border-color:var(--chapter);
  background:var(--chapter-soft)
}
.pair.solved{
  background:#eaf8f1;
  border-color:#8fd0aa;
  color:#17633b;
  opacity:.78;
  box-shadow:none
}

.drag-layout{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px
}
.drag-bank,.drop-bank{display:grid;gap:11px}
.drag-card{
  position:relative;
  background:linear-gradient(160deg,#fff,#fafcff);
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px 15px;
  min-height:54px;
  touch-action:none;
  user-select:none;
  box-shadow:0 6px 15px rgba(24,48,80,.05);
  transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease
}
.drag-card::after{
  content:"⋮⋮";
  position:absolute;right:13px;top:50%;transform:translateY(-50%);
  color:#9ba9bc;letter-spacing:-3px
}
.drag-card:hover{
  transform:translateY(-1px);
  box-shadow:0 9px 18px rgba(24,48,80,.08)
}
.drag-card.dragging{
  position:fixed;
  z-index:999;
  width:min(320px,80vw);
  box-shadow:0 20px 46px rgba(0,0,0,.22);
  pointer-events:none;
  transform:rotate(1deg)
}
.drop-zone{
  border:2px dashed #b8c7da;
  border-radius:17px;
  padding:13px;
  min-height:76px;
  background:linear-gradient(160deg,#f9fbfe,#f4f8fd);
  transition:all .16s ease
}
.drop-zone.hot{
  border-color:var(--chapter);
  background:var(--chapter-soft);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--chapter) 10%, transparent)
}
.drop-zone .zone-title{
  font-weight:820;
  margin-bottom:8px;
  color:#344258
}
.drop-zone .drag-card{
  margin-top:8px;
  border-color:#9fd3b7;
  background:#effaf4
}

.sort-list{display:grid;gap:11px}
.sort-item{
  background:linear-gradient(160deg,#fff,#fafcff);
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px 15px;
  display:flex;gap:11px;align-items:center;
  touch-action:none;
  box-shadow:0 5px 14px rgba(24,48,80,.04);
  transition:transform .14s ease,box-shadow .14s ease
}
